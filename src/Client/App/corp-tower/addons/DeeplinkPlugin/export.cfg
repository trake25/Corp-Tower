; Injected into AndroidManifest.xml at export time by DeeplinkPlugin.gd.
; The scheme/host pair here MUST match AuthManager.REDIRECT_ANDROID and the URL
; registered in Supabase's redirect allow list -- test_auth_pkce.gd asserts the
; first of those, Supabase silently falls back to its Site URL for the second.
; is_auto_verify is false on purpose: autoVerify drives Android App Link
; verification against a .well-known/assetlinks.json over https, which a custom
; scheme has no way to serve.
; path_prefix is empty on purpose: REDIRECT_ANDROID has no path segment
; ("scheme://host", nothing between host and the query string), so the actual
; redirect URI's path is empty. Android's pathPrefix match requires the URI's
; path to begin with "/", which an empty path never does -- "/" here silently
; broke the intent filter and left Chrome with no handler for the redirect.

[auth_callback]

label="Top or Drop sign-in"
scheme="com.galaxxigames.tod"
host="auth-callback"
path_prefix=""
is_auto_verify=false
is_default=true
is_browsable=true
