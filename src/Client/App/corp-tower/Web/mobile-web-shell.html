<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}
#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}
#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#mobile-boot-overlay {
	position: fixed;
	inset: 0;
	z-index: 2;
	background: $GODOT_SPLASH_COLOR;
	pointer-events: none;
}

#mobile-boot-overlay canvas {
	display: block;
	width: 100%;
	height: 100%;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>
		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const statusOverlay = document.getElementById('status');
	const statusSplash = document.getElementById('status-splash');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const isMobileBrowser = typeof navigator !== 'undefined' && (
		(navigator.userAgentData && navigator.userAgentData.mobile === true) ||
		/Android|webOS|iPhone|iPad|iPod|IEMobile|Opera Mini|Mobi/i.test(navigator.userAgent || '')
	);
	let mobileBootOverlay = null;
	let mobileBootResize = null;

	function dismissMobileBootOverlay(hideStatus) {
		if (mobileBootResize != null && window.visualViewport) {
			window.visualViewport.removeEventListener('resize', mobileBootResize);
		}
		if (mobileBootResize != null) {
			window.removeEventListener('resize', mobileBootResize);
		}
		mobileBootResize = null;
		if (mobileBootOverlay != null) {
			mobileBootOverlay.remove();
			mobileBootOverlay = null;
		}
		if (hideStatus) {
			statusOverlay.style.visibility = 'hidden';
		}
	}

	function createMobileBootOverlay() {
		if (!isMobileBrowser) {
			return;
		}
		mobileBootOverlay = document.createElement('div');
		mobileBootOverlay.id = 'mobile-boot-overlay';
		const overlayCanvas = document.createElement('canvas');
		mobileBootOverlay.appendChild(overlayCanvas);
		document.body.appendChild(mobileBootOverlay);
		const context = overlayCanvas.getContext('2d');
		const draw = function () {
			const visualViewport = window.visualViewport;
			const width = Math.max(1, Math.round(visualViewport ? visualViewport.width : window.innerWidth));
			const height = Math.max(1, Math.round(visualViewport ? visualViewport.height : window.innerHeight));
			const pixelRatio = window.devicePixelRatio || 1;
			overlayCanvas.width = Math.round(width * pixelRatio);
			overlayCanvas.height = Math.round(height * pixelRatio);
			context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
			context.clearRect(0, 0, width, height);
			if (!statusSplash.complete || statusSplash.naturalWidth <= 0 || statusSplash.naturalHeight <= 0) {
				return;
			}
			const centerWidth = height * statusSplash.naturalWidth / statusSplash.naturalHeight;
			const centerLeft = (width - centerWidth) * 0.5;
			context.drawImage(statusSplash, centerLeft, 0, centerWidth, height);
			if (centerLeft > 0) {
				context.drawImage(statusSplash, 0, 0, 1, statusSplash.naturalHeight, 0, 0, centerLeft, height);
				context.drawImage(statusSplash, statusSplash.naturalWidth - 1, 0, 1, statusSplash.naturalHeight, centerLeft + centerWidth, 0, centerLeft, height);
			}
		};
		mobileBootResize = draw;
		statusSplash.addEventListener('load', draw, { once: true });
		if (window.visualViewport) {
			window.visualViewport.addEventListener('resize', draw);
		}
		window.addEventListener('resize', draw);
		draw();
	}

	createMobileBootOverlay();
	if (isMobileBrowser) {
		window.__topOrDropDismissMobileBootOverlay = function () {
			dismissMobileBootOverlay(true);
		};
	}

	let initializing = true;
	let statusMode = '';
	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}
	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}
	function displayFailureNotice(err) {
		dismissMobileBootOverlay(false);
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
