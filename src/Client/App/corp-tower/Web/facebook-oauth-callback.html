<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top or Drop authentication</title>
</head>
<body>
  <p id="status">Opening Facebook…</p>
  <script>
    (() => {
      "use strict";

      const FLOW_PREFIX = "corp_tower_facebook_auth_tab_flow:";
      const RESULT_PREFIX = "corp_tower_facebook_auth_tab_result:";
      const CHANNEL = "corp_tower_facebook_auth_tab";
      const RESULT_TYPE = "corp_tower_facebook_auth_tab_result";
      const status = document.getElementById("status");
      const query = new URLSearchParams(window.location.search);
      const state = query.get("state") || "";
      const transaction = query.get("transaction") || state;
      const isLaunch = query.get("launch") === "1";

      const setStatus = (message) => {
        status.textContent = message;
      };

      const readFlow = () => {
        if (!transaction) return null;
        try {
          const raw = window.localStorage.getItem(FLOW_PREFIX + transaction);
          return raw ? JSON.parse(raw) : null;
        } catch (_) {
          return null;
        }
      };

      const hasValidFlow = (flow) => {
        if (!flow || typeof flow !== "object") return false;
        if (flow.transaction !== transaction || flow.origin !== window.location.origin) return false;
        if (flow.redirect_uri !== window.location.origin + window.location.pathname) return false;
        if (flow.purpose !== "sign_in" && flow.purpose !== "facebook_link_preflight") return false;
        if (!Number.isFinite(flow.expires_at_unix) || flow.expires_at_unix <= Date.now() / 1000) return false;

        try {
          const authorize = new URL(flow.authorize_url);
          return (
            authorize.origin === "https://www.facebook.com" &&
            authorize.pathname === "/v22.0/dialog/oauth" &&
            authorize.searchParams.get("state") === transaction &&
            authorize.searchParams.get("redirect_uri") === flow.redirect_uri &&
            authorize.searchParams.get("response_type") === "code"
          );
        } catch (_) {
          return false;
        }
      };

      const flow = readFlow();
      if (!hasValidFlow(flow)) {
        setStatus("This authentication request is invalid or has expired. Return to Top or Drop and try again.");
        return;
      }

      if (isLaunch) {
        if (state || query.has("code") || query.has("error")) {
          setStatus("This authentication request is invalid. Return to Top or Drop and try again.");
          return;
        }
        window.location.replace(flow.authorize_url);
        return;
      }

      if (!state || state !== transaction || (!query.has("code") && !query.has("error"))) {
        setStatus("Facebook did not return a valid authentication result. Return to Top or Drop and try again.");
        return;
      }

      const result = {
        state,
        code: query.get("code") || "",
        error: query.get("error") || "",
        error_code: query.get("error_code") || "",
        origin: window.location.origin
      };

      try {
        window.localStorage.setItem(RESULT_PREFIX + transaction, JSON.stringify(result));
        window.localStorage.removeItem(FLOW_PREFIX + transaction);
      } catch (_) {
        setStatus("Top or Drop could not safely receive this authentication result. Return to the game and try again.");
        return;
      }

      const envelope = { type: RESULT_TYPE, result };
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(envelope, window.location.origin);
          window.opener.focus();
        }
      } catch (_) {}
      try {
        const channel = new BroadcastChannel(CHANNEL);
        channel.postMessage(envelope);
        channel.close();
      } catch (_) {}

      setStatus("Returning to Top or Drop…");
      window.setTimeout(() => window.close(), 0);
    })();
  </script>
</body>
</html>
