<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#101215" />
    <title>Top or Drop — Under Maintenance</title>
    <!-- Deployed in place of the built site by Site-Cleanup-Workers.yml. Styles
         are inline because this ships alone, without dist/_astro. Palette is
         Mono Slate, matching src/styles/global.css by hand. -->
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #101215;
        color: #f0f2f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.58;
      }

      .panel {
        text-align: center;
        padding: 0 1.5rem;
        max-width: 34rem;
      }

      .mark {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c9a227;
        margin: 0 0 1.1rem;
      }

      h1 {
        font-size: clamp(1.6rem, 1.3rem + 1.4vw, 2.4rem);
        font-weight: 700;
        letter-spacing: -0.035em;
        margin: 0 0 0.9rem;
      }

      p.body {
        margin: 0;
        color: #a3abb5;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <p class="mark">Maintenance</p>
      <h1>Back shortly.</h1>
      <p class="body">This site is temporarily offline. Nothing is broken on your end.</p>
    </div>
  </body>
</html>
