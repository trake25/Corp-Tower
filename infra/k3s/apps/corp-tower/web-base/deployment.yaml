apiVersion: apps/v1
kind: Deployment
metadata:
  name: corp-tower-web
  labels:
    app.kubernetes.io/name: corp-tower-web
    app.kubernetes.io/part-of: corp-tower
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: corp-tower-web
      app.kubernetes.io/part-of: corp-tower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: corp-tower-web
        app.kubernetes.io/part-of: corp-tower
    spec:
      imagePullSecrets:
        - name: ecr-pull
      containers:
        - name: corp-tower-web
          image: corp-tower-web:lab-placeholder
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
