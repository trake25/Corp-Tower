resources:
  - ../web-base
  - configmap.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: corp-tower-web
      spec:
        template:
          spec:
            containers:
              - name: corp-tower-web
                image: nginx:alpine
                volumeMounts:
                  - name: maintenance-html
                    mountPath: /usr/share/nginx/html
                    readOnly: true
            volumes:
              - name: maintenance-html
                configMap:
                  name: corp-tower-web-maintenance
