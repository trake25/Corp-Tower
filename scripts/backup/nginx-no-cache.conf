# Godot web exports reuse fixed filenames (index.html/.wasm/.pck) across
# builds, so without this, browsers and Cloudflare's edge both cache them
# heuristically and a redeploy is invisible until the visitor manually
# clears their cache — see KB/docs/context/deployment.md. no-cache (not
# no-store) forces revalidation on every load but still lets nginx's
# built-in ETag/Last-Modified answer with a 304 when a file is unchanged,
# so only an actual redeploy triggers a real re-download.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
