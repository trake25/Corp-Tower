name: Verify EKS destroy
description: Confirms resources tagged for the EKS stack are gone after Terraform destroy

inputs:
  stack-tag:
    description: Stack tag value to verify
    required: false
    default: server-eks

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/verify.sh" "${{ inputs.stack-tag }}"
