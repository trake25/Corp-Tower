name: Backup Cleanup devwstod2

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: "Type CLEANUP_DEVWSTOD2 to confirm."
        required: true
        type: string

jobs:
  guard:
    name: Check Cleanup Confirmation
    runs-on: ubuntu-24.04
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm_cleanup }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "CLEANUP_DEVWSTOD2" ]; then
            echo "::error::confirm_cleanup must be exactly CLEANUP_DEVWSTOD2."
            exit 1
          fi

  cleanup:
    name: Cleanup devwstod2
    needs: guard
    if: needs.guard.result == 'success'
    uses: ./.github/workflows/Backup-Cleanup-Game-Server.yml
    with:
      target: devwstod2
