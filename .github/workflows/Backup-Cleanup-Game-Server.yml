name: Backup Cleanup Game Server (core)

on:
  workflow_call:
    inputs:
      target:
        description: "Dev game server instance to stop: devwstod1, devwstod2, or wstoddemo."
        required: true
        type: string

concurrency:
  group: backup-server-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  cleanup-backup:
    name: Stop Corp Tower Server On Backup Machine
    runs-on: [self-hosted, backup]
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve instance number
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            devwstod1) echo "INSTANCE=1" >> "$GITHUB_ENV" ;;
            devwstod2) echo "INSTANCE=2" >> "$GITHUB_ENV" ;;
            wstoddemo) echo "INSTANCE=3" >> "$GITHUB_ENV" ;;
            *)
              echo "::error::Unknown target '${{ inputs.target }}'. Expected devwstod1, devwstod2, or wstoddemo."
              exit 1
              ;;
          esac

      - name: Run backup server down
        run: "scripts/backup/backup-server-down.sh $INSTANCE"
