name: Backup Cleanup Game Server

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Backup game instance to clean up (stops the container; DNS record is left in place)."
        required: true
        default: devwstod1
        type: choice
        options:
          - devwstod1
          - devwstod2
          - all
      confirm_cleanup:
        description: "Type CLEANUP_DEVWSTOD1, CLEANUP_DEVWSTOD2, or CLEANUP_ALL_DEVWSTOD to match the target chosen above."
        required: true
        type: string

jobs:
  guard:
    name: Check Cleanup Confirmation
    runs-on: ubuntu-24.04
    steps:
      - name: Verify confirmation matches target
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm_cleanup }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            devwstod1) expected="CLEANUP_DEVWSTOD1" ;;
            devwstod2) expected="CLEANUP_DEVWSTOD2" ;;
            all) expected="CLEANUP_ALL_DEVWSTOD" ;;
            *) echo "::error::Unknown target $TARGET"; exit 1 ;;
          esac
          if [ "$CONFIRM" != "$expected" ]; then
            echo "::error::confirm_cleanup must be exactly $expected for target $TARGET."
            exit 1
          fi

  cleanup-devwstod1:
    name: Cleanup devwstod1
    needs: guard
    if: needs.guard.result == 'success' && (inputs.target == 'devwstod1' || inputs.target == 'all')
    uses: ./.github/workflows/Backup-Cleanup-Game-Server.yml
    with:
      target: devwstod1

  cleanup-devwstod2:
    name: Cleanup devwstod2
    needs: [guard, cleanup-devwstod1]
    if: |
      always() &&
      needs.guard.result == 'success' &&
      (inputs.target == 'devwstod2' || inputs.target == 'all') &&
      (needs.cleanup-devwstod1.result == 'success' || needs.cleanup-devwstod1.result == 'skipped')
    uses: ./.github/workflows/Backup-Cleanup-Game-Server.yml
    with:
      target: devwstod2
