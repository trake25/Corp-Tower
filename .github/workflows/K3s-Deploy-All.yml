name: K3s Deploy All

# All four targets share one EC2-GW gateway (one Caddy container, one R2 ACME
# archive key) - deploying them in parallel would race on that shared state,
# so every stage below deliberately waits for the previous one to finish,
# regardless of which combination of deploy_target/environment was chosen.

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Which server(s) to deploy."
        required: true
        type: choice
        options:
          - All
          - Game only
          - Web only
        default: All
      environment:
        description: "Which K3s environment(s) to deploy."
        required: true
        type: choice
        options:
          - prod
          - test
          - all
        default: all

permissions:
  id-token: write
  contents: read

jobs:
  deploy-game-prod:
    name: Deploy wsplaytod
    if: inputs.deploy_target != 'Web only' && inputs.environment != 'test'
    uses: ./.github/workflows/K3s-Deploy-Game-Server.yml
    with:
      target: wsplaytod
    secrets: inherit

  deploy-game-test:
    name: Deploy wstodtest
    needs: deploy-game-prod
    if: |
      always() &&
      inputs.deploy_target != 'Web only' && inputs.environment != 'prod' &&
      (needs.deploy-game-prod.result == 'success' || needs.deploy-game-prod.result == 'skipped')
    uses: ./.github/workflows/K3s-Deploy-Game-Server.yml
    with:
      target: wstodtest
    secrets: inherit

  deploy-web-prod:
    name: Deploy playtod
    needs: [deploy-game-prod, deploy-game-test]
    if: |
      always() &&
      inputs.deploy_target != 'Game only' && inputs.environment != 'test' &&
      (needs.deploy-game-prod.result == 'success' || needs.deploy-game-prod.result == 'skipped') &&
      (needs.deploy-game-test.result == 'success' || needs.deploy-game-test.result == 'skipped')
    uses: ./.github/workflows/K3s-Deploy-Web-Server.yml
    with:
      target: playtod
    secrets: inherit

  deploy-web-test:
    name: Deploy todtest
    needs: [deploy-game-prod, deploy-game-test, deploy-web-prod]
    if: |
      always() &&
      inputs.deploy_target != 'Game only' && inputs.environment != 'prod' &&
      (needs.deploy-game-prod.result == 'success' || needs.deploy-game-prod.result == 'skipped') &&
      (needs.deploy-game-test.result == 'success' || needs.deploy-game-test.result == 'skipped') &&
      (needs.deploy-web-prod.result == 'success' || needs.deploy-web-prod.result == 'skipped')
    uses: ./.github/workflows/K3s-Deploy-Web-Server.yml
    with:
      target: todtest
    secrets: inherit
