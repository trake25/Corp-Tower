name: EKS Infra Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY_EKS to tear down the EKS session stack."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VAR_aws_region: ap-southeast-1
  TF_VAR_environment: eks-lab
  TF_VAR_ecr_repository_name: ${{ secrets.ECR_REPOSITORY }}
  TF_VAR_operator_principal_arn: ${{ secrets.EKS_OPERATOR_PRINCIPAL_ARN }}

jobs:
  destroy:
    name: Destroy EKS Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    defaults:
      run:
        working-directory: infra/eks/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check destroy confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY_EKS" ]; then
            echo "confirm_destroy must be exactly DESTROY_EKS."
            exit 1
          fi

      - name: Setup AWS credentials and Terraform
        uses: ./.github/actions/aws-terraform-setup
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform backend bucket exists
        uses: ./.github/actions/terraform-backend-bootstrap
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve

      - name: Check for orphaned billable resources
        working-directory: .
        run: |
          set -euo pipefail

          # NAT Gateway deletion is asynchronous (lingers in "deleting" for a
          # few minutes) and the Resource Groups Tagging API itself has its
          # own eventual-consistency lag on top of that, so a resource can
          # briefly still be reported here even after terraform destroy has
          # already succeeded. Poll instead of failing on the first read.
          ATTEMPTS=6
          SLEEP_SECONDS=30

          for i in $(seq 1 "$ATTEMPTS"); do
            RESOURCES_JSON="$(
              aws resourcegroupstaggingapi get-resources \
                --tag-filters Key=Stack,Values=server-eks \
                --output json
            )"

            ORPHAN_COUNT="$(printf '%s' "$RESOURCES_JSON" | jq '.ResourceTagMappingList | length')"

            if [ "$ORPHAN_COUNT" -eq 0 ]; then
              echo "No resources tagged Stack=server-eks remain. Destroy is clean."
              exit 0
            fi

            echo "Attempt ${i}/${ATTEMPTS}: ${ORPHAN_COUNT} resource(s) tagged Stack=server-eks still visible, rechecking in ${SLEEP_SECONDS}s..."
            printf '%s' "$RESOURCES_JSON" | jq -r '.ResourceTagMappingList[].ResourceARN'

            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo "::error::${ORPHAN_COUNT} resource(s) tagged Stack=server-eks still exist after destroy (M-8)."
          printf '%s' "$RESOURCES_JSON" | jq -r '.ResourceTagMappingList[].ResourceARN'
          exit 1
