name: EKS Infra Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY_EKS to tear down the EKS session stack."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VAR_aws_region: ap-southeast-1
  TF_VAR_environment: eks-lab
  TF_VAR_ecr_repository_name: ${{ secrets.ECR_REPOSITORY }}
  TF_VAR_operator_principal_arn: ${{ secrets.EKS_OPERATOR_PRINCIPAL_ARN }}

jobs:
  destroy:
    name: Destroy EKS Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    defaults:
      run:
        working-directory: infra/eks/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check destroy confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY_EKS" ]; then
            echo "confirm_destroy must be exactly DESTROY_EKS."
            exit 1
          fi

      - name: Setup AWS credentials and Terraform
        uses: ./.github/actions/aws-terraform-setup
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform backend bucket exists
        uses: ./.github/actions/terraform-backend-bootstrap
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve

      - name: Check for orphaned billable resources
        working-directory: .
        run: |
          set -uo pipefail

          # The Resource Groups Tagging API is a separate, eventually-consistent
          # search index - it can keep listing a resource's ARN well after the
          # resource itself is actually gone (observed lag here outlasted a
          # 2.5 minute retry window). It is not authoritative on its own, so
          # any ARN it reports is cross-checked directly against the live EC2
          # API before being treated as a real orphan.

          RESOURCES_JSON="$(
            aws resourcegroupstaggingapi get-resources \
              --tag-filters Key=Stack,Values=server-eks \
              --output json
          )"

          mapfile -t ARNS < <(printf '%s' "$RESOURCES_JSON" | jq -r '.ResourceTagMappingList[].ResourceARN')

          STILL_LIVE=()

          for arn in "${ARNS[@]}"; do
            resource_part="${arn##*:}"
            rtype="${resource_part%%/*}"
            rid="${resource_part##*/}"

            case "$rtype" in
              natgateway)
                state="$(aws ec2 describe-nat-gateways --nat-gateway-ids "$rid" \
                           --query 'NatGateways[0].State' --output text 2>/dev/null)"
                if [ -n "$state" ] && [ "$state" != "deleted" ] && [ "$state" != "None" ]; then
                  STILL_LIVE+=("$arn (state: $state)")
                fi
                ;;
              subnet)
                if aws ec2 describe-subnets --subnet-ids "$rid" >/dev/null 2>&1; then
                  STILL_LIVE+=("$arn")
                fi
                ;;
              security-group-rule)
                if aws ec2 describe-security-group-rules --security-group-rule-ids "$rid" >/dev/null 2>&1; then
                  STILL_LIVE+=("$arn")
                fi
                ;;
              *)
                # Unrecognized resource type for this check - be conservative.
                STILL_LIVE+=("$arn")
                ;;
            esac
          done

          if [ "${#STILL_LIVE[@]}" -gt 0 ]; then
            echo "::error::${#STILL_LIVE[@]} resource(s) tagged Stack=server-eks are confirmed still live after destroy (M-8)."
            printf '%s\n' "${STILL_LIVE[@]}"
            exit 1
          fi

          if [ "${#ARNS[@]}" -gt 0 ]; then
            echo "Tagging-API index still lists ${#ARNS[@]} resource(s), but live EC2 lookups confirm all are actually gone. Destroy is clean."
          else
            echo "No resources tagged Stack=server-eks remain. Destroy is clean."
          fi
