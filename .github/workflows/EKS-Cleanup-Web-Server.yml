name: EKS Cleanup Web Server (core)

# corp-tower-prod also hosts the game server (EKS-Cleanup-Game-Server.yml), so
# this deletes only the web server's own Deployment/Service by name - never
# the namespace itself, and the cluster stays up.

on:
  workflow_call:
    inputs:
      target:
        description: "Web server environment to clean up: todplay."
        required: true
        type: string

concurrency:
  group: eks-cleanup-web-server-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  CLUSTER_NAME: corp-tower-eks-lab

jobs:
  cleanup-web:
    name: Delete Corp Tower Web Server Resources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Resolve target environment
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            todplay) echo "NAMESPACE=corp-tower-prod" >> "$GITHUB_ENV" ;;
            *)
              echo "::error::Unknown target '${{ inputs.target }}'. Expected todplay."
              exit 1
              ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Delete Corp Tower web server resources
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete deployment corp-tower-web --ignore-not-found=true --wait=true --timeout=120s
          kubectl -n "$NAMESPACE" delete service corp-tower-web --ignore-not-found=true
          echo "Web server resources removed from $NAMESPACE (namespace, cluster, and game server, if any, left untouched)."
