name: Backup Deploy Web Server (core)

on:
  workflow_call:
    inputs:
      target:
        description: "Dev web server instance to deploy: devtod1 or devtod2."
        required: true
        type: string
      art_version_override:
        description: "Optional art bundle version (e.g. v2) to fetch instead of the pinned manifest. Skips sha256 verification — testing only, never for release."
        required: false
        default: ""
        type: string

concurrency:
  group: backup-web-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  resolve-target:
    name: Resolve Target Instance
    runs-on: ubuntu-24.04
    outputs:
      instance: ${{ steps.resolve.outputs.instance }}
      ws_primary: ${{ steps.resolve.outputs.ws_primary }}
      ws_failover: ${{ steps.resolve.outputs.ws_failover }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            devtod1)
              echo "instance=1" >> "$GITHUB_OUTPUT"
              echo "ws_primary=wss://devwstod1.galaxxigames.com" >> "$GITHUB_OUTPUT"
              echo "ws_failover=wss://devwstod2.galaxxigames.com" >> "$GITHUB_OUTPUT"
              ;;
            devtod2)
              echo "instance=2" >> "$GITHUB_OUTPUT"
              echo "ws_primary=wss://devwstod2.galaxxigames.com" >> "$GITHUB_OUTPUT"
              echo "ws_failover=wss://devwstod1.galaxxigames.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown target '${{ inputs.target }}'. Expected devtod1 or devtod2."
              exit 1
              ;;
          esac

  build:
    needs: resolve-target
    runs-on: ubuntu-24.04

    env:
      GODOT_VERSION: "4.6.2"
      GODOT_STATUS: "stable"
      GODOT_PROJECT_PATH: "src/Client/App/corp-tower"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch private art assets
        uses: ./.github/actions/fetch-private-assets
        with:
          manifest-path: src/Client/App/corp-tower/Cor/art-manifest.json
          dest-path: src/Client/App/corp-tower/Cor/Art
          bucket: ${{ secrets.R2_BUCKET }}
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          version-override: ${{ inputs.art_version_override }}

      - name: Write client endpoint config
        env:
          CORP_TOWER_WS_PRIMARY: ${{ needs.resolve-target.outputs.ws_primary }}
          CORP_TOWER_WS_FAILOVER: ${{ needs.resolve-target.outputs.ws_failover }}
          CORP_TOWER_DEBUG_UI: "true"
        run: scripts/write-endpoint-config.sh

      - name: Build web export
        uses: ./.github/actions/build-godot-web
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          godot-status: ${{ env.GODOT_STATUS }}
          project-path: ${{ env.GODOT_PROJECT_PATH }}
          output-dir: ${{ github.workspace }}/build/web
          preset-config: .github/godot/export_presets.web.ci.cfg

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ inputs.target }}
          path: build/web
          retention-days: 1

      - name: Remove private assets from runner
        if: always()
        run: rm -rf "$GODOT_PROJECT_PATH/Cor/Art"

  deploy-to-backup:
    needs: [resolve-target, build]
    runs-on: [self-hosted, backup]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ inputs.target }}
          path: build/web

      - name: Deploy to backup machine
        run: "scripts/backup/backup-web-up.sh ${{ needs.resolve-target.outputs.instance }}"
        env:
          CORP_TOWER_WEB_BUILD_DIR: ${{ github.workspace }}/build/web
          CORP_TOWER_WEB_BUILD_SHA: ${{ github.sha }}
