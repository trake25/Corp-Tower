name: K3s Cleanup Web-playtod

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: "Type CLEANUP_PLAYTOD to remove the playtod web server (Deployment+Service) from corp-tower-prod. The namespace and any game server there are left untouched."
        required: true
        type: string

jobs:
  guard:
    name: Check Cleanup Confirmation
    runs-on: ubuntu-24.04
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm_cleanup }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "CLEANUP_PLAYTOD" ]; then
            echo "::error::confirm_cleanup must be exactly CLEANUP_PLAYTOD."
            exit 1
          fi

  cleanup:
    name: Cleanup playtod
    needs: guard
    if: needs.guard.result == 'success'
    uses: ./.github/workflows/K3s-Cleanup-Web-Server.yml
    with:
      target: playtod
    secrets: inherit
