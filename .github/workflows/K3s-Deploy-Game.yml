name: K3s Deploy Game Server

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Game server environment to deploy."
        required: true
        default: wsplaytod
        type: choice
        options:
          - wsplaytod
          - wstodtest
          - all

jobs:
  # Both targets share one EC2-GW gateway (one Caddy container, one R2 ACME
  # archive key) - deploying them in parallel would race on that shared
  # state, so wstodtest deliberately waits for wsplaytod to finish.
  deploy-wsplaytod:
    name: Deploy wsplaytod
    if: inputs.target == 'wsplaytod' || inputs.target == 'all'
    uses: ./.github/workflows/K3s-Deploy-Game-Server.yml
    with:
      target: wsplaytod
    secrets: inherit

  deploy-wstodtest:
    name: Deploy wstodtest
    needs: deploy-wsplaytod
    if: |
      always() &&
      (inputs.target == 'wstodtest' || inputs.target == 'all') &&
      (needs.deploy-wsplaytod.result == 'success' || needs.deploy-wsplaytod.result == 'skipped')
    uses: ./.github/workflows/K3s-Deploy-Game-Server.yml
    with:
      target: wstodtest
    secrets: inherit
