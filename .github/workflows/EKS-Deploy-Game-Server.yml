name: EKS Deploy Game Server (core)

on:
  workflow_call:
    inputs:
      target:
        description: "Game server environment to deploy: wstodplay (prod; eks-test is committed, not deployed)."
        required: true
        type: string

concurrency:
  group: eks-deploy-game-server-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  CLUSTER_NAME: corp-tower-eks-lab

jobs:
  test-server:
    name: Test Server On GitHub VM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: src/Server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run server tests
        run: npm test

  verify-infra:
    name: Verify Infra Matches Last Apply
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup AWS credentials
        uses: ./.github/actions/aws-terraform-setup
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          setup-terraform: "false"

      - name: Fail fast on unapplied infra changes
        uses: ./.github/actions/eks-infra-drift-check
        with:
          aws-region: ${{ env.AWS_REGION }}

  build-and-push:
    name: Build And Push Docker Image To ECR
    runs-on: ubuntu-24.04
    needs: [test-server, verify-infra]
    if: ${{ needs.test-server.result == 'success' && needs.verify-infra.result == 'success' }}
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: src/Server
          file: src/Server/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record pushed image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "Docker image pushed: $IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"

  deploy-eks:
    name: Deploy Corp Tower To EKS
    runs-on: ubuntu-24.04
    needs: build-and-push
    if: ${{ needs.build-and-push.result == 'success' }}
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve target environment
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            wstodplay)
              echo "NAMESPACE=corp-tower-prod" >> "$GITHUB_ENV"
              echo "OVERLAY=eks-prod/game" >> "$GITHUB_ENV"
              echo "GAME_DOMAIN=wstodplay.galaxxigames.com" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unknown target '${{ inputs.target }}'. Only wstodplay is deployed (eks-test overlays are committed, not deployed)."
              exit 1
              ;;
          esac

      - name: Setup AWS credentials and Terraform
        uses: ./.github/actions/aws-terraform-setup
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Node.js for WebSocket smoke test
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.1"

      - name: Read EKS Terraform outputs
        working-directory: infra/eks/terraform
        env:
          TF_VAR_aws_region: ap-southeast-1
          TF_VAR_environment: eks-lab
          TF_VAR_ecr_repository_name: ${{ secrets.ECR_REPOSITORY }}
          TF_VAR_operator_principal_arn: ${{ secrets.EKS_OPERATOR_PRINCIPAL_ARN }}
        run: |
          set -euo pipefail
          terraform init -input=false
          {
            echo "ALB_DNS_NAME=$(terraform output -raw alb_dns_name)"
            echo "REDIS_URL=$(terraform output -raw redis_url)"
          } >> "$GITHUB_ENV"

      - name: Update Cloudflare CNAME content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID staging environment secret."
            exit 1
          fi

          existing_record_id="$(
            curl -fsS \
              --connect-timeout 5 \
              --max-time 15 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --get "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
              --data-urlencode "type=CNAME" \
              --data-urlencode "name=${GAME_DOMAIN}" \
            | jq -r '.result[0].id // empty'
          )"

          if [ -n "$existing_record_id" ]; then
            cloudflare_response="$(
              curl -fsS \
                --connect-timeout 5 \
                --max-time 15 \
                -X PATCH \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${existing_record_id}" \
                --data "$(jq -n --arg dns "${ALB_DNS_NAME}" '{content:$dns}')"
            )"
          else
            cloudflare_response="$(
              curl -fsS \
                --connect-timeout 5 \
                --max-time 15 \
                -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
                --data "$(jq -n --arg name "${GAME_DOMAIN}" --arg dns "${ALB_DNS_NAME}" '{type:"CNAME",name:$name,content:$dns,ttl:60,proxied:false}')"
            )"
          fi

          cloudflare_success="$(printf '%s\n' "$cloudflare_response" | jq -r '.success')"
          if [ "$cloudflare_success" != "true" ]; then
            echo "::error::Cloudflare DNS update failed for ${GAME_DOMAIN}: ${cloudflare_response}"
            exit 1
          fi

          alb_ips="$(getent ahostsv4 "$ALB_DNS_NAME" | awk '{ print $1 }' | sort -u)"

          if [ -z "$alb_ips" ]; then
            echo "::error::${ALB_DNS_NAME} (the ALB's own DNS name) did not resolve to any IPs, so ${GAME_DOMAIN} can never be verified against it. Check the Terraform output / ALB provisioning state instead of retrying."
            exit 1
          fi

          resolved_ip=""
          for attempt in $(seq 1 60); do
            resolved_ip="$(getent ahostsv4 "$GAME_DOMAIN" | awk '{ print $1; exit }' || true)"
            if printf '%s\n' "$alb_ips" | grep -qx "$resolved_ip"; then
              break
            fi
            echo "Waiting for ${GAME_DOMAIN} to resolve through its CNAME to ${ALB_DNS_NAME}; current: ${resolved_ip:-none} (attempt ${attempt}/60)."
            sleep 5
          done

          if ! printf '%s\n' "$alb_ips" | grep -qx "$resolved_ip"; then
            echo "::error::${GAME_DOMAIN} did not resolve to ${ALB_DNS_NAME} (${alb_ips}) after Cloudflare DNS update (waited 5 minutes)."
            exit 1
          fi

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Refresh ECR image pull secret
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry ecr-pull \
            --docker-server="$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="$ECR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          {
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          } >> "$GITHUB_ENV"

      - name: Sync Supabase service role secret
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # Piped through apply so the value never reaches the workflow log,
          # same as the ecr-pull secret above.
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "No SUPABASE_SERVICE_ROLE_KEY set - profile persistence stays off."
            kubectl -n "$NAMESPACE" delete secret corp-tower-supabase --ignore-not-found
            exit 0
          fi

          kubectl -n "$NAMESPACE" create secret generic corp-tower-supabase \
            --from-literal=service-role-key="$SUPABASE_SERVICE_ROLE_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync Facebook native verification secret
        env:
          FACEBOOK_APP_ID: ${{ vars.TOD_FACEBOOK_APP_ID || '' }}
          FACEBOOK_APP_SECRET: ${{ secrets.TOD_FACEBOOK_APP_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${FACEBOOK_APP_ID:-}" ] || [ -z "${FACEBOOK_APP_SECRET:-}" ]; then
            echo "Facebook native verification is disabled."
            kubectl -n "$NAMESPACE" delete secret corp-tower-facebook --ignore-not-found
            exit 0
          fi

          kubectl -n "$NAMESPACE" create secret generic corp-tower-facebook \
            --from-literal=app-id="$FACEBOOK_APP_ID" \
            --from-literal=app-secret="$FACEBOOK_APP_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Corp Tower Kustomize overlay
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          # Unset secrets resolve to empty, which leaves token verification off
          # and the server on the pre-Supabase profile id path.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_AUTH_REQUIRED: ${{ vars.SUPABASE_AUTH_REQUIRED || 'false' }}
        run: |
          set -euo pipefail

          TEMP_APP_ROOT="$RUNNER_TEMP/corp-tower-eks/apps"
          RUNTIME_OVERLAY="$TEMP_APP_ROOT/corp-tower/overlays/runtime"
          mkdir -p "$TEMP_APP_ROOT" "$RUNTIME_OVERLAY"
          cp -R "$GITHUB_WORKSPACE/infra/eks/apps/corp-tower" "$TEMP_APP_ROOT/"

          cat > "$RUNTIME_OVERLAY/kustomization.yaml" <<EOF
          resources:
            - ../${OVERLAY}
          images:
            - name: corp-tower-server
              newName: ${ECR_REGISTRY}/${ECR_REPOSITORY}
              newTag: ${GITHUB_SHA}
          patches:
            - patch: |-
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: corp-tower-server
                spec:
                  template:
                    spec:
                      containers:
                        - name: corp-tower-server
                          env:
                            - name: REDIS_URL
                              value: ${REDIS_URL}
                            - name: SUPABASE_URL
                              value: "${SUPABASE_URL}"
                            - name: SUPABASE_AUTH_REQUIRED
                              value: "${SUPABASE_AUTH_REQUIRED}"
          EOF

          kubectl apply -k "$RUNTIME_OVERLAY"

          set +e
          kubectl -n "$NAMESPACE" rollout status deployment/corp-tower-server --timeout=300s
          ROLLOUT_STATUS=$?
          set -e

          echo "--- Nodes ---"
          kubectl get nodes -o wide
          echo "--- Namespace resources ---"
          kubectl -n "$NAMESPACE" get all -o wide
          echo "--- Pod describe ---"
          kubectl -n "$NAMESPACE" describe pods -l app.kubernetes.io/name=corp-tower-server
          echo "--- Pod logs ---"
          kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/name=corp-tower-server --all-containers --tail=200 --prefix || true

          if [ "$ROLLOUT_STATUS" -ne 0 ]; then
            echo "::error::Deployment rollout did not become ready; see pod describe/logs above."
            exit "$ROLLOUT_STATUS"
          fi

      - name: Assert Redis wiring reached the pod
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" exec deploy/corp-tower-server -- printenv REDIS_URL | grep -q '^rediss://'

      - name: Assert ElastiCache sees connections
        env:
          TF_VAR_aws_region: ap-southeast-1
          TF_VAR_environment: eks-lab
          TF_VAR_ecr_repository_name: ${{ secrets.ECR_REPOSITORY }}
          TF_VAR_operator_principal_arn: ${{ secrets.EKS_OPERATOR_PRINCIPAL_ARN }}
        working-directory: infra/eks/terraform
        run: |
          set -euo pipefail
          CLUSTER_ID="$(terraform output -raw cluster_name)-redis-001"

          for attempt in $(seq 1 12); do
            CONNECTIONS="$(
              aws cloudwatch get-metric-statistics --namespace AWS/ElastiCache \
                --metric-name CurrConnections --statistics Maximum --period 300 \
                --dimensions Name=CacheClusterId,Value="$CLUSTER_ID" \
                --start-time "$(date -u -d '10 min ago' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" \
                --query 'Datapoints[0].Maximum' --output text
            )"

            if [ "$CONNECTIONS" != "None" ] && [ -n "$CONNECTIONS" ]; then
              echo "ElastiCache ${CLUSTER_ID} sees ${CONNECTIONS} connections."
              break
            fi

            echo "Waiting for ElastiCache connection metrics (attempt ${attempt}/12)."
            sleep 15
          done

          if [ "$CONNECTIONS" = "None" ] || [ -z "$CONNECTIONS" ]; then
            echo "::error::No CurrConnections metric for ${CLUSTER_ID}. A Running pod is not evidence Redis is connected."
            exit 1
          fi

      - name: Smoke test public WebSocket
        run: |
          set -euo pipefail

          WS_URL="wss://${GAME_DOMAIN}"

          for attempt in $(seq 1 30); do
            if WS_URL="$WS_URL" node - <<'NODE'
          const url = process.env.WS_URL;
          const timeout = setTimeout(() => {
            console.error(`Timed out connecting to ${url}`);
            process.exit(1);
          }, 5000);

          const socket = new WebSocket(url);
          socket.addEventListener("open", () => {
            clearTimeout(timeout);
            socket.close();
            process.exit(0);
          });
          socket.addEventListener("error", (event) => {
            clearTimeout(timeout);
            console.error(`WebSocket error for ${url}`);
            process.exit(1);
          });
          NODE
            then
              echo "WebSocket smoke connected to ${WS_URL}."
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "::error::WebSocket smoke could not connect to ${WS_URL}."
              exit 1
            fi

            echo "Waiting for public WebSocket through the ALB (attempt ${attempt}/30)."
            sleep 10
          done

      - name: Hold an idle WebSocket connection past 60s
        run: |
          set -euo pipefail

          WS_URL="wss://${GAME_DOMAIN}"

          for attempt in $(seq 1 5); do
            if WS_URL="$WS_URL" node - <<'NODE'
          const url = process.env.WS_URL;
          const socket = new WebSocket(url);
          const openTimeout = setTimeout(() => {
            console.error(`Timed out connecting to ${url}`);
            process.exit(1);
          }, 10000);

          socket.addEventListener("open", () => {
            clearTimeout(openTimeout);
            const holdMs = 65000;
            const start = Date.now();

            socket.addEventListener("close", (event) => {
              const elapsed = Date.now() - start;
              if (elapsed < holdMs) {
                console.error(`Connection closed after ${elapsed}ms (code ${event.code}), before the ${holdMs}ms idle_timeout window.`);
                process.exit(1);
              }
            });

            setTimeout(() => {
              if (socket.readyState !== WebSocket.OPEN) {
                console.error(`Socket not open after ${holdMs}ms idle hold.`);
                process.exit(1);
              }
              console.log(`Idle WebSocket survived ${holdMs}ms; ALB idle_timeout is in effect.`);
              socket.close();
              process.exit(0);
            }, holdMs);
          });

          socket.addEventListener("error", () => {
            console.error(`WebSocket error for ${url}`);
            process.exit(1);
          });
          NODE
            then
              echo "Idle WebSocket hold passed for ${WS_URL}."
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Idle WebSocket hold could not complete for ${WS_URL} after 5 attempts."
              exit 1
            fi

            echo "Retrying idle WebSocket hold (attempt ${attempt}/5)."
            sleep 5
          done
