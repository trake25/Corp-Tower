name: K3s Cleanup Web Server (core)

# corp-tower-prod/corp-tower-test also host that environment's game server
# (K3s-Cleanup-Game-Server.yml), so this deletes only the web server's own
# Deployment/Service by name - never the namespace itself.

on:
  workflow_call:
    inputs:
      target:
        description: "Web server environment to clean up: playtod (prod) or todtest (test)."
        required: true
        type: string

concurrency:
  group: k3s-cleanup-web-server-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  cleanup-web:
    name: Delete Corp Tower Web Server Resources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve target environment
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            playtod) echo "NAMESPACE=corp-tower-prod" >> "$GITHUB_ENV" ;;
            todtest) echo "NAMESPACE=corp-tower-test" >> "$GITHUB_ENV" ;;
            *)
              echo "::error::Unknown target '${{ inputs.target }}'. Expected playtod or todtest."
              exit 1
              ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Resolve Server K3s targets
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/corp-tower-k3s"
          INSTANCES_JSON="$RUNNER_TEMP/corp-tower-k3s/k3s-lab-instances.json"
          INVENTORY_JSON="$RUNNER_TEMP/corp-tower-k3s/k3s-lab-inventory.json"

          aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=corp-tower" \
              "Name=tag:Environment,Values=k3s-lab" \
              "Name=tag:Role,Values=k3s-gateway,k3s-control-plane,k3s-agent" \
              "Name=instance-state-name,Values=running" \
            --output json > "$INSTANCES_JSON"

          python infra/k3s/ansible/scripts/generate_k3s_inventory.py \
            --instances-json "$INSTANCES_JSON" \
            --inventory "$INVENTORY_JSON" \
            --ssh-user "$EC2_USER" \
            --ssh-port "$EC2_PORT" \
            --ssh-key-file "$HOME/.ssh/ec2_key" \
            --known-hosts-file "$HOME/.ssh/known_hosts" \
            --github-env "$GITHUB_ENV" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Prepare SSH known hosts
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
          EC2_SSH_KEY: ${{ secrets.EC2_STAGING_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          SSH_OPTS=(
            -i ~/.ssh/ec2_key
            -p "$EC2_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )

          ssh-keygen -R "[$GATEWAY_PUBLIC_IP]:$EC2_PORT" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keyscan -T 10 -p "$EC2_PORT" -H "$GATEWAY_PUBLIC_IP" >> ~/.ssh/known_hosts

          ssh "${SSH_OPTS[@]}" "$EC2_USER@$GATEWAY_PUBLIC_IP" "hostname && whoami"

          PROXY_COMMAND="ssh -i $HOME/.ssh/ec2_key -p $EC2_PORT -o BatchMode=yes -o ConnectTimeout=20 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -W %h:%p $EC2_USER@$GATEWAY_PUBLIC_IP"

          scan_output="$(
            ssh "${SSH_OPTS[@]}" "$EC2_USER@$GATEWAY_PUBLIC_IP" \
              "ssh-keyscan -T 10 -p '$EC2_PORT' -H '$CONTROL_PLANE_PRIVATE_IP' 2>/dev/null" || true
          )"
          printf '%s\n' "$scan_output" >> ~/.ssh/known_hosts

      - name: Open bastion tunnel and fetch kubeconfig
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
        run: |
          set -euo pipefail

          KUBE_API_PORT=16443
          KUBECONFIG_PATH="$RUNNER_TEMP/corp-tower-k3s/kubeconfig"
          SSH_OPTS=(
            -i ~/.ssh/ec2_key
            -p "$EC2_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ExitOnForwardFailure=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )

          ssh "${SSH_OPTS[@]}" \
            -f -N \
            -L "${KUBE_API_PORT}:${CONTROL_PLANE_PRIVATE_IP}:6443" \
            "$EC2_USER@$GATEWAY_PUBLIC_IP"

          PROXY_COMMAND="ssh -i $HOME/.ssh/ec2_key -p $EC2_PORT -o BatchMode=yes -o ConnectTimeout=20 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -W %h:%p $EC2_USER@$GATEWAY_PUBLIC_IP"

          ssh "${SSH_OPTS[@]}" \
            -o "ProxyCommand=$PROXY_COMMAND" \
            "$EC2_USER@$CONTROL_PLANE_PRIVATE_IP" \
            "sudo cat /etc/rancher/k3s/k3s.yaml" > "$KUBECONFIG_PATH"

          sed -i "s#https://127.0.0.1:6443#https://127.0.0.1:${KUBE_API_PORT}#g" "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Delete Corp Tower web server resources
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete deployment corp-tower-web --ignore-not-found=true --wait=true --timeout=120s
          kubectl -n "$NAMESPACE" delete service corp-tower-web --ignore-not-found=true
          echo "Web server resources removed from $NAMESPACE (namespace and game server, if any, left untouched)."
