name: Docs and Agent Validation

on:
  pull_request:
  push:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .agents/**
      - .claude/skills/**
      - docs/context/**
      - site/docs/**
      - scripts/**
      - report/**
      - .github/workflows/Docs-Agent-Validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-agent-config.mjs
      - run: node scripts/build-file-map.mjs --check
      - run: node scripts/validate-docs.mjs --quiet
      - run: node site/tools/validate-site-docs.mjs --quiet
      - run: node --test scripts/tests/*.mjs
      - run: node scripts/benchmark-rag.mjs --check
