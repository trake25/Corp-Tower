name: Backup Deploy Game Server

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/Server/**"
      - ".github/workflows/Backup-Deploy-Game.yml"

  workflow_dispatch:
    inputs:
      target:
        description: "Backup game instance to deploy. Push events always target devwstod1."
        required: true
        default: devwstod1
        type: choice
        options:
          - devwstod1
          - devwstod2
          - all

jobs:
  resolve-target:
    name: Resolve Target
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=devwstod1" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

  check-devwstod1-status:
    name: Check devwstod1 Status
    needs: resolve-target
    if: github.event_name == 'push'
    runs-on: [self-hosted, backup]
    timeout-minutes: 5
    outputs:
      devwstod1_up: ${{ steps.check.outputs.devwstod1_up }}
    steps:
      - name: Check for a running devwstod1 container
        id: check
        run: |
          set -euo pipefail
          if docker ps --filter "name=corp-tower-server-1" --filter "status=running" --format '{{.Names}}' | grep -q .; then
            echo "devwstod1_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "devwstod1_up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::corp-tower-server-1 is not running on the backup machine (stood down) — skipping auto-deploy. Dispatch this workflow manually to redeploy."
          fi

  deploy-devwstod1:
    name: Deploy devwstod1
    needs: [resolve-target, check-devwstod1-status]
    if: |
      always() &&
      (needs.resolve-target.outputs.target == 'devwstod1' || needs.resolve-target.outputs.target == 'all') &&
      (needs.check-devwstod1-status.result == 'skipped' || needs.check-devwstod1-status.outputs.devwstod1_up == 'true')
    uses: ./.github/workflows/Backup-Deploy-Game-Server.yml
    with:
      target: devwstod1

  deploy-devwstod2:
    name: Deploy devwstod2
    needs: [resolve-target, deploy-devwstod1]
    if: |
      always() &&
      (needs.resolve-target.outputs.target == 'devwstod2' || needs.resolve-target.outputs.target == 'all') &&
      (needs.deploy-devwstod1.result == 'success' || needs.deploy-devwstod1.result == 'skipped')
    uses: ./.github/workflows/Backup-Deploy-Game-Server.yml
    with:
      target: devwstod2
