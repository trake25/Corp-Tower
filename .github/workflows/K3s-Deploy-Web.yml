name: K3s Deploy Web Server

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Web server environment to deploy."
        required: true
        default: playtod
        type: choice
        options:
          - playtod
          - todtest
          - all

permissions:
  id-token: write
  contents: read

jobs:
  # Both targets share one EC2-GW gateway (one Caddy container, one R2 ACME
  # archive key) - deploying them in parallel would race on that shared
  # state, so todtest deliberately waits for playtod to finish.
  deploy-playtod:
    name: Deploy playtod
    if: inputs.target == 'playtod' || inputs.target == 'all'
    uses: ./.github/workflows/K3s-Deploy-Web-Server.yml
    with:
      target: playtod
    secrets: inherit

  deploy-todtest:
    name: Deploy todtest
    needs: deploy-playtod
    if: |
      always() &&
      (inputs.target == 'todtest' || inputs.target == 'all') &&
      (needs.deploy-playtod.result == 'success' || needs.deploy-playtod.result == 'skipped')
    uses: ./.github/workflows/K3s-Deploy-Web-Server.yml
    with:
      target: todtest
    secrets: inherit
