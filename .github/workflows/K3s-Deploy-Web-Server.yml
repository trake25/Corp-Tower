name: K3s Deploy Web Server (core)

on:
  workflow_call:
    inputs:
      target:
        description: "Web server environment to deploy: playtod (prod) or todtest (test)."
        required: true
        type: string

concurrency:
  group: k3s-deploy-web-server-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  GODOT_VERSION: "4.6.2"
  GODOT_STATUS: "stable"
  GODOT_PROJECT_PATH: "src/Client/App/corp-tower"

jobs:
  resolve-target:
    name: Resolve Target Environment
    runs-on: ubuntu-24.04
    outputs:
      namespace: ${{ steps.resolve.outputs.namespace }}
      overlay: ${{ steps.resolve.outputs.overlay }}
      domain: ${{ steps.resolve.outputs.domain }}
      ws_primary: ${{ steps.resolve.outputs.ws_primary }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            playtod)
              echo "namespace=corp-tower-prod" >> "$GITHUB_OUTPUT"
              echo "overlay=web-prod" >> "$GITHUB_OUTPUT"
              echo "domain=playtod.galaxxigames.com" >> "$GITHUB_OUTPUT"
              echo "ws_primary=wss://wsplaytod.galaxxigames.com" >> "$GITHUB_OUTPUT"
              ;;
            todtest)
              echo "namespace=corp-tower-test" >> "$GITHUB_OUTPUT"
              echo "overlay=web-test" >> "$GITHUB_OUTPUT"
              echo "domain=todtest.galaxxigames.com" >> "$GITHUB_OUTPUT"
              echo "ws_primary=wss://wstodtest.galaxxigames.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown target '${{ inputs.target }}'. Expected playtod or todtest."
              exit 1
              ;;
          esac

  build:
    name: Build Web Export
    needs: resolve-target
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch private art assets
        uses: ./.github/actions/fetch-private-assets
        with:
          manifest-path: src/Client/App/corp-tower/Cor/art-manifest.json
          dest-path: src/Client/App/corp-tower/Cor/Art
          bucket: ${{ secrets.R2_BUCKET }}
          account-id: ${{ secrets.R2_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Write client endpoint config
        env:
          CORP_TOWER_WS_PRIMARY: ${{ needs.resolve-target.outputs.ws_primary }}
          CORP_TOWER_WS_FAILOVER: ""
          CORP_TOWER_DEBUG_UI: "false"
        run: scripts/write-endpoint-config.sh

      - name: Build web export
        uses: ./.github/actions/build-godot-web
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          godot-status: ${{ env.GODOT_STATUS }}
          project-path: ${{ env.GODOT_PROJECT_PATH }}
          output-dir: ${{ github.workspace }}/build/web
          preset-config: .github/godot/export_presets.web.ci.cfg

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ inputs.target }}
          path: build/web
          retention-days: 1

      - name: Remove private assets from runner
        if: always()
        run: rm -rf "$GODOT_PROJECT_PATH/Cor/Art"

  push:
    name: Build And Push Web Image To ECR
    needs: [resolve-target, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ inputs.target }}
          path: docker/web/web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push web Docker image
        uses: docker/build-push-action@v7
        with:
          context: docker/web
          file: docker/web/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:web-${{ inputs.target }}-${{ github.sha }}

  deploy-k3s:
    name: Deploy Web Server To K3s
    needs: [resolve-target, push]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      NAMESPACE: ${{ needs.resolve-target.outputs.namespace }}
      OVERLAY: ${{ needs.resolve-target.outputs.overlay }}
      GATEWAY_DOMAIN: ${{ needs.resolve-target.outputs.domain }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/k3s/ansible/requirements.txt

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Ansible
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r infra/k3s/ansible/requirements.txt
          ansible --version

      - name: Resolve Server K3s targets
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/corp-tower-k3s"
          INSTANCES_JSON="$RUNNER_TEMP/corp-tower-k3s/k3s-lab-instances.json"
          INVENTORY_JSON="$RUNNER_TEMP/corp-tower-k3s/k3s-lab-inventory.json"

          aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=corp-tower" \
              "Name=tag:Environment,Values=k3s-lab" \
              "Name=tag:Role,Values=k3s-gateway,k3s-control-plane,k3s-agent" \
              "Name=instance-state-name,Values=running" \
            --output json > "$INSTANCES_JSON"

          python infra/k3s/ansible/scripts/generate_k3s_inventory.py \
            --instances-json "$INSTANCES_JSON" \
            --inventory "$INVENTORY_JSON" \
            --ssh-user "$EC2_USER" \
            --ssh-port "$EC2_PORT" \
            --ssh-key-file "$HOME/.ssh/ec2_key" \
            --known-hosts-file "$HOME/.ssh/known_hosts" \
            --github-env "$GITHUB_ENV" \
            --github-summary "$GITHUB_STEP_SUMMARY"

          PRIVATE_SUBNET_CIDR="$(
            aws ec2 describe-subnets \
              --filters \
                "Name=tag:Project,Values=corp-tower" \
                "Name=tag:Environment,Values=k3s-lab" \
                "Name=tag:Tier,Values=private" \
              --query 'Subnets[0].CidrBlock' \
              --output text
          )"

          if [ -z "$PRIVATE_SUBNET_CIDR" ] || [ "$PRIVATE_SUBNET_CIDR" = "None" ]; then
            echo "::error::Could not resolve Server K3s private subnet CIDR."
            exit 1
          fi

          echo "PRIVATE_SUBNET_CIDR=$PRIVATE_SUBNET_CIDR" >> "$GITHUB_ENV"

      - name: Update Cloudflare DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ZONE_ID staging environment secret."
            exit 1
          fi

          # Every K3s deploy renders the gateway's full Caddyfile (all four
          # sites), so every deploy also upserts DNS for all four.
          DOMAINS="$(grep -oP 'domain:\s*\K[^,}]+' infra/k3s/gateway_sites.yml | tr -d ' ')"

          for DOMAIN in $DOMAINS; do
            existing_record_id="$(
              curl -fsS \
                --connect-timeout 5 \
                --max-time 15 \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --get "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
                --data-urlencode "type=A" \
                --data-urlencode "name=${DOMAIN}" \
              | jq -r '.result[0].id // empty'
            )"

            if [ -n "$existing_record_id" ]; then
              cloudflare_response="$(
                curl -fsS \
                  --connect-timeout 5 \
                  --max-time 15 \
                  -X PATCH \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${existing_record_id}" \
                  --data "$(jq -n --arg ip "${GATEWAY_PUBLIC_IP}" '{content:$ip}')"
              )"
            else
              cloudflare_response="$(
                curl -fsS \
                  --connect-timeout 5 \
                  --max-time 15 \
                  -X POST \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records" \
                  --data "$(jq -n --arg name "${DOMAIN}" --arg ip "${GATEWAY_PUBLIC_IP}" '{type:"A",name:$name,content:$ip,ttl:60,proxied:false}')"
              )"
            fi

            cloudflare_success="$(printf '%s\n' "$cloudflare_response" | jq -r '.success')"
            if [ "$cloudflare_success" != "true" ]; then
              echo "::error::Cloudflare DNS update failed for ${DOMAIN}: ${cloudflare_response}"
              exit 1
            fi

            resolved_ip=""
            for attempt in $(seq 1 60); do
              resolved_ip="$(getent ahostsv4 "$DOMAIN" | awk '{ print $1; exit }' || true)"
              if [ "$resolved_ip" = "$GATEWAY_PUBLIC_IP" ]; then
                break
              fi
              echo "Waiting for ${DOMAIN} to resolve to ${GATEWAY_PUBLIC_IP}; current: ${resolved_ip:-none} (attempt ${attempt}/60)."
              sleep 2
            done

            if [ "$resolved_ip" != "$GATEWAY_PUBLIC_IP" ]; then
              echo "::error::${DOMAIN} did not resolve to ${GATEWAY_PUBLIC_IP} after Cloudflare DNS update."
              exit 1
            fi
          done

      - name: Prepare SSH known hosts
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
          EC2_SSH_KEY: ${{ secrets.EC2_STAGING_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          mkdir -p ~/.ansible/cp
          chmod 700 ~/.ssh
          chmod 700 ~/.ansible
          chmod 700 ~/.ansible/cp
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          SSH_OPTS=(
            -i ~/.ssh/ec2_key
            -p "$EC2_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ConnectionAttempts=3
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )

          ssh-keygen -R "[$GATEWAY_PUBLIC_IP]:$EC2_PORT" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keyscan -T 10 -p "$EC2_PORT" -H "$GATEWAY_PUBLIC_IP" >> ~/.ssh/known_hosts

          ssh "${SSH_OPTS[@]}" "$EC2_USER@$GATEWAY_PUBLIC_IP" "hostname && whoami"

          PROXY_COMMAND="ssh -i $HOME/.ssh/ec2_key -p $EC2_PORT -o BatchMode=yes -o ConnectTimeout=20 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -W %h:%p $EC2_USER@$GATEWAY_PUBLIC_IP"

          for PRIVATE_IP in $K3S_NODE_PRIVATE_IPS; do
            scan_output="$(
              ssh "${SSH_OPTS[@]}" "$EC2_USER@$GATEWAY_PUBLIC_IP" \
                "ssh-keyscan -T 10 -p '$EC2_PORT' -H '$PRIVATE_IP' 2>/dev/null" || true
            )"

            if [ -z "$scan_output" ]; then
              echo "::error::Could not fetch SSH host key for private K3s node ${PRIVATE_IP} through EC2-GW."
              exit 1
            fi

            printf '%s\n' "$scan_output" >> ~/.ssh/known_hosts
          done

      - name: Restore Caddy gateway state from R2
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_GATEWAY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_GATEWAY_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ secrets.R2_GATEWAY_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          # SAFETY EXCEPTION to the no-source-comments convention (Summary.md):
          # this step holds R2 credentials in env, and the downloaded archive
          # holds the gateway's ACME account key + TLS private key. Never add
          # `set -x` here, and never widen the umask/permissions below.
          set -euo pipefail
          umask 077

          if [ -z "${R2_BUCKET:-}" ]; then
            echo "R2_GATEWAY_BUCKET not set; skipping Caddy state restore."
            exit 0
          fi

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ARCHIVE="$RUNNER_TEMP/corp-tower-caddy-data.tar.gz"
          ERR_LOG="$RUNNER_TEMP/r2-restore-err.txt"
          trap 'rm -f "$ARCHIVE" "$ERR_LOG"' EXIT

          SSH_OPTS=(
            -i ~/.ssh/ec2_key
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )

          if aws s3api get-object \
                --endpoint-url "$ENDPOINT" \
                --bucket "$R2_BUCKET" \
                --key "gateway/caddy-data.tar.gz" \
                "$ARCHIVE" >/dev/null 2>"$ERR_LOG"; then
            echo "Restoring saved Caddy gateway ACME cache from R2."
            scp "${SSH_OPTS[@]}" -P "$EC2_PORT" "$ARCHIVE" "$EC2_USER@$GATEWAY_PUBLIC_IP:/tmp/corp-tower-caddy-data.tar.gz"
          else
            echo "No saved Caddy gateway state in R2 yet, or fetch failed; continuing without restore."
            sed -e 's/[A-Za-z0-9/+=]\{32,\}/<redacted>/g' "$ERR_LOG" || true
          fi

      - name: Run K3s Ansible syntax check
        env:
          ANSIBLE_CONFIG: infra/k3s/ansible/ansible.cfg
        run: |
          set -euo pipefail
          ansible-playbook \
            -i "$ANSIBLE_INVENTORY" \
            infra/k3s/ansible/playbooks/site.yml \
            --syntax-check

      - name: Configure Server K3s hosts with Ansible
        env:
          ANSIBLE_CONFIG: infra/k3s/ansible/ansible.cfg
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          ansible-playbook \
            -i "$ANSIBLE_INVENTORY" \
            infra/k3s/ansible/playbooks/site.yml \
            -e "@infra/k3s/gateway_sites.yml" \
            -e "private_subnet_cidr=${PRIVATE_SUBNET_CIDR}"

      - name: Persist Caddy gateway state to R2
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_GATEWAY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_GATEWAY_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ""
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ secrets.R2_GATEWAY_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          # SAFETY EXCEPTION to the no-source-comments convention (Summary.md):
          # this step holds R2 credentials in env, and the fetched archive
          # holds the gateway's ACME account key + TLS private key. Never add
          # `set -x` here, and never widen the umask/permissions below.
          set -euo pipefail
          umask 077

          if [ -z "${R2_BUCKET:-}" ]; then
            echo "R2_GATEWAY_BUCKET not set; skipping Caddy state persistence."
            exit 0
          fi

          ARCHIVE="$RUNNER_TEMP/corp-tower-caddy-data-save.tar.gz"
          ERR_LOG="$RUNNER_TEMP/r2-persist-err.txt"
          trap 'rm -f "$ARCHIVE" "$ERR_LOG"' EXIT

          SSH_OPTS=(
            -i ~/.ssh/ec2_key
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )

          scp "${SSH_OPTS[@]}" -P "$EC2_PORT" \
            "$EC2_USER@$GATEWAY_PUBLIC_IP:/tmp/corp-tower-caddy-data.tar.gz" "$ARCHIVE"

          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if ! aws s3api put-object \
                --endpoint-url "$ENDPOINT" \
                --bucket "$R2_BUCKET" \
                --key "gateway/caddy-data.tar.gz" \
                --body "$ARCHIVE" >/dev/null 2>"$ERR_LOG"; then
            echo "::error::Failed to save Caddy gateway state to R2."
            sed -e 's/[A-Za-z0-9/+=]\{32,\}/<redacted>/g' "$ERR_LOG" || true
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" -p "$EC2_PORT" "$EC2_USER@$GATEWAY_PUBLIC_IP" \
            "rm -f /tmp/corp-tower-caddy-data.tar.gz" || true

          echo "Saved Caddy gateway ACME cache to R2."

      - name: Open bastion tunnel and fetch kubeconfig
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
        run: |
          set -euo pipefail

          KUBE_API_PORT=16443
          KUBECONFIG_PATH="$RUNNER_TEMP/corp-tower-k3s/kubeconfig"
          SSH_OPTS=(
            -i ~/.ssh/ec2_key
            -p "$EC2_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ExitOnForwardFailure=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )

          ssh "${SSH_OPTS[@]}" \
            -f -N \
            -L "${KUBE_API_PORT}:${CONTROL_PLANE_PRIVATE_IP}:6443" \
            "$EC2_USER@$GATEWAY_PUBLIC_IP"

          PROXY_COMMAND="ssh -i $HOME/.ssh/ec2_key -p $EC2_PORT -o BatchMode=yes -o ConnectTimeout=20 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes -W %h:%p $EC2_USER@$GATEWAY_PUBLIC_IP"

          ssh "${SSH_OPTS[@]}" \
            -o "ProxyCommand=$PROXY_COMMAND" \
            "$EC2_USER@$CONTROL_PLANE_PRIVATE_IP" \
            "sudo cat /etc/rancher/k3s/k3s.yaml" > "$KUBECONFIG_PATH"

          sed -i "s#https://127.0.0.1:6443#https://127.0.0.1:${KUBE_API_PORT}#g" "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Refresh ECR image pull secret
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry ecr-pull \
            --docker-server="$ECR_REGISTRY" \
            --docker-username=AWS \
            --docker-password="$ECR_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"

      - name: Apply Corp Tower Web Kustomize overlay
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          TEMP_APP_ROOT="$RUNNER_TEMP/corp-tower-k3s/apps"
          RUNTIME_OVERLAY="$TEMP_APP_ROOT/corp-tower/overlays/runtime-web"
          mkdir -p "$TEMP_APP_ROOT" "$RUNTIME_OVERLAY"
          cp -R "$GITHUB_WORKSPACE/infra/k3s/apps/corp-tower" "$TEMP_APP_ROOT/"

          cat > "$RUNTIME_OVERLAY/kustomization.yaml" <<EOF
          resources:
            - ../${OVERLAY}
          images:
            - name: corp-tower-web
              newName: ${ECR_REGISTRY}/${ECR_REPOSITORY}
              newTag: web-${{ inputs.target }}-${GITHUB_SHA}
          EOF

          kubectl apply -k "$RUNTIME_OVERLAY"
          kubectl -n "$NAMESPACE" rollout status deployment/corp-tower-web --timeout=180s
          kubectl -n "$NAMESPACE" get all -o wide

      - name: Smoke test public web build
        run: |
          set -euo pipefail

          URL="https://${GATEWAY_DOMAIN}/"

          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$status" = "200" ]; then
              echo "Web smoke connected to ${URL} (HTTP $status)."
              exit 0
            fi
            echo "Waiting for public web build through Caddy (attempt ${attempt}/30, last status: ${status:-none})."
            sleep 10
          done

          echo "::error::Web smoke could not reach ${URL} with HTTP 200."
          exit 1

      - name: Dump Caddy gateway logs on smoke test failure
        if: failure()
        env:
          EC2_USER: ${{ secrets.EC2_STAGING_USER }}
          EC2_PORT: ${{ secrets.EC2_STAGING_PORT || 22 }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -i ~/.ssh/ec2_key
            -p "$EC2_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o UserKnownHostsFile=~/.ssh/known_hosts
            -o GlobalKnownHostsFile=/dev/null
            -o StrictHostKeyChecking=yes
          )

          echo "::group::corp-tower-k3s-caddy container status"
          ssh "${SSH_OPTS[@]}" "$EC2_USER@$GATEWAY_PUBLIC_IP" \
            "sudo docker ps -a --filter name=corp-tower-k3s-caddy" || true
          echo "::endgroup::"

          echo "::group::corp-tower-k3s-caddy logs (last 200 lines)"
          ssh "${SSH_OPTS[@]}" "$EC2_USER@$GATEWAY_PUBLIC_IP" \
            "sudo docker logs --tail 200 corp-tower-k3s-caddy" || true
          echo "::endgroup::"
