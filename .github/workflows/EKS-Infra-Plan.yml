name: EKS Infra Plan

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VAR_aws_region: ap-southeast-1
  TF_VAR_environment: eks-lab
  TF_VAR_ecr_repository_name: ${{ secrets.ECR_REPOSITORY }}
  TF_VAR_operator_principal_arn: ${{ secrets.EKS_OPERATOR_PRINCIPAL_ARN }}
  TF_VAR_ci_principal_arn: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  plan:
    name: Plan EKS Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup AWS credentials and Terraform
        uses: ./.github/actions/aws-terraform-setup
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform backend bucket exists
        uses: ./.github/actions/terraform-backend-bootstrap
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Reconcile EKS operator access state
        working-directory: infra/eks/terraform
        run: bash ../../../scripts/eks-access-state-reconcile.sh

      - name: Terraform validate and plan
        uses: ./.github/actions/terraform-validate-plan
        with:
          working-directory: infra/eks/terraform

      - name: Reject EKS cluster replacement or deletion
        working-directory: infra/eks/terraform
        run: |
          set -euo pipefail
          cluster_actions="$(terraform show -json tfplan | jq -cer '
            [.resource_changes[]? | select(.address == "aws_eks_cluster.main") | .change.actions] as $matches
            | if ($matches | length) > 1 then error("multiple cluster changes")
              elif ($matches | length) == 1 then $matches[0]
              else []
              end
          ')" || {
            echo "::error::Could not determine aws_eks_cluster.main plan actions."
            exit 1
          }
          if jq -e 'index("delete") != null' <<<"$cluster_actions" >/dev/null; then
            echo "::error::Rejected EKS cluster plan containing delete action(s): ${cluster_actions}"
            exit 1
          fi
          echo "EKS cluster plan actions: ${cluster_actions}"
