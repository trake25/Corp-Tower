name: K3s Cleanup All Web Server

on:
  workflow_dispatch:
    inputs:
      confirm_cleanup:
        description: "Type CLEANUP_WEB to remove both playtod and todtest web servers (Deployment+Service). Namespaces and game servers are left untouched."
        required: true
        type: string

jobs:
  guard:
    name: Check Cleanup Confirmation
    runs-on: ubuntu-24.04
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm_cleanup }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "CLEANUP_WEB" ]; then
            echo "::error::confirm_cleanup must be exactly CLEANUP_WEB."
            exit 1
          fi

  cleanup-playtod:
    name: Cleanup playtod
    needs: guard
    if: needs.guard.result == 'success'
    uses: ./.github/workflows/K3s-Cleanup-Web-Server.yml
    with:
      target: playtod
    secrets: inherit

  cleanup-todtest:
    name: Cleanup todtest
    needs: cleanup-playtod
    uses: ./.github/workflows/K3s-Cleanup-Web-Server.yml
    with:
      target: todtest
    secrets: inherit
