name: Backup Cleanup All

# Cleanup Game stops the game container(s); Cleanup Web stands down the web
# container(s). DNS records are left in place pointing at the idle tunnel
# either way - only stop_cloudflared_if_idle (backup-common.sh) tears down
# the shared Cloudflare Tunnel, and only once all four containers are down,
# so cleaning up one service/instance never cuts off the other three.

on:
  workflow_dispatch:
    inputs:
      cleanup_target:
        description: "Which server(s) to clean up."
        required: true
        type: choice
        options:
          - All
          - Game only
          - Web only
        default: All
      instance:
        description: "Which backup instance(s) to clean up."
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - all
        default: all
      confirm_cleanup:
        description: "Type the confirmation phrase matching cleanup_target/instance (see the workflow run summary if unsure)."
        required: true
        type: string

jobs:
  guard:
    name: Check Cleanup Confirmation
    runs-on: ubuntu-24.04
    steps:
      - name: Verify confirmation matches target
        env:
          TARGET: ${{ inputs.cleanup_target }}
          INSTANCE: ${{ inputs.instance }}
          CONFIRM: ${{ inputs.confirm_cleanup }}
        run: |
          set -euo pipefail
          case "$TARGET|$INSTANCE" in
            "Game only|1") expected="CLEANUP_DEVWSTOD1" ;;
            "Game only|2") expected="CLEANUP_DEVWSTOD2" ;;
            "Game only|all") expected="CLEANUP_ALL_DEVWSTOD" ;;
            "Web only|1") expected="CLEANUP_DEVTOD1" ;;
            "Web only|2") expected="CLEANUP_DEVTOD2" ;;
            "Web only|all") expected="CLEANUP_ALL_DEVTOD" ;;
            "All|1") expected="CLEANUP_ALL_INSTANCE1" ;;
            "All|2") expected="CLEANUP_ALL_INSTANCE2" ;;
            "All|all") expected="CLEANUP_ALL" ;;
            *)
              echo "::error::Unknown combination cleanup_target=$TARGET instance=$INSTANCE"
              exit 1
              ;;
          esac

          echo "Required confirm_cleanup phrase: $expected" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CONFIRM" != "$expected" ]; then
            echo "::error::confirm_cleanup must be exactly $expected for cleanup_target=$TARGET, instance=$INSTANCE."
            exit 1
          fi

  cleanup-devwstod1:
    name: Cleanup devwstod1
    needs: guard
    if: inputs.cleanup_target != 'Web only' && inputs.instance != '2'
    uses: ./.github/workflows/Backup-Cleanup-Game-Server.yml
    with:
      target: devwstod1

  cleanup-devwstod2:
    name: Cleanup devwstod2
    needs: guard
    if: inputs.cleanup_target != 'Web only' && inputs.instance != '1'
    uses: ./.github/workflows/Backup-Cleanup-Game-Server.yml
    with:
      target: devwstod2

  cleanup-devtod1:
    name: Cleanup devtod1
    needs: guard
    if: inputs.cleanup_target != 'Game only' && inputs.instance != '2'
    uses: ./.github/workflows/Backup-Cleanup-Web-Server.yml
    with:
      target: devtod1

  cleanup-devtod2:
    name: Cleanup devtod2
    needs: guard
    if: inputs.cleanup_target != 'Game only' && inputs.instance != '1'
    uses: ./.github/workflows/Backup-Cleanup-Web-Server.yml
    with:
      target: devtod2
