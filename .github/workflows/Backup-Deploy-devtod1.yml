name: Backup Deploy devtod1

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/Client/**"
      - ".github/actions/build-godot-web/**"
      - ".github/actions/fetch-private-assets/**"
      - ".github/godot/export_presets.web.ci.cfg"
      - "scripts/write-endpoint-config.sh"
      - ".github/workflows/Backup-Deploy-devtod1.yml"

  workflow_dispatch:
    inputs:
      art_version_override:
        description: "Optional art bundle version (e.g. v2) to fetch instead of the pinned manifest. Skips sha256 verification — testing only, never for release."
        required: false
        default: ""
        type: string

jobs:
  check-devtod1-status:
    name: Check devtod1 Status
    if: github.event_name == 'push'
    runs-on: [self-hosted, backup]
    timeout-minutes: 5
    outputs:
      devtod1_up: ${{ steps.check.outputs.devtod1_up }}
    steps:
      - name: Check for a running devtod1 container
        id: check
        run: |
          set -euo pipefail
          if docker ps --filter "name=corp-tower-web-1" --filter "status=running" --format '{{.Names}}' | grep -q .; then
            echo "devtod1_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "devtod1_up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::corp-tower-web-1 is not running on the backup machine (stood down) — skipping auto-deploy. Dispatch this workflow manually to redeploy."
          fi

  deploy:
    name: Deploy devtod1
    needs: check-devtod1-status
    if: |
      always() &&
      (needs.check-devtod1-status.result == 'skipped' || needs.check-devtod1-status.outputs.devtod1_up == 'true')
    uses: ./.github/workflows/Backup-Deploy-Web-Server.yml
    with:
      target: devtod1
      art_version_override: ${{ inputs.art_version_override }}
    secrets: inherit
