name: K3s Cleanup All

# Cleanup Game deletes the game server's own Deployment/Service (and its
# namespace-local Redis) by name - never the namespace itself. Cleanup Web
# replaces the web server's running content with an offline/maintenance
# placeholder instead of deleting it, so the Service and public DNS record
# keep answering. Neither touches the other workload in its namespace, and
# neither touches Caddy/DNS state, so all selected jobs can run in parallel.

on:
  workflow_dispatch:
    inputs:
      cleanup_target:
        description: "Which server(s) to clean up."
        required: true
        type: choice
        options:
          - All
          - Game only
          - Web only
        default: All
      environment:
        description: "Which K3s environment(s) to clean up."
        required: true
        type: choice
        options:
          - prod
          - test
          - all
        default: all
      confirm_cleanup:
        description: "Type the confirmation phrase matching cleanup_target/environment (see the workflow run summary if unsure)."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Check Cleanup Confirmation
    runs-on: ubuntu-24.04
    steps:
      - name: Verify confirmation matches target
        env:
          TARGET: ${{ inputs.cleanup_target }}
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm_cleanup }}
        run: |
          set -euo pipefail
          case "$TARGET|$ENVIRONMENT" in
            "Game only|prod") expected="CLEANUP_WSPLAYTOD" ;;
            "Game only|test") expected="CLEANUP_WSTODTEST" ;;
            "Game only|all") expected="CLEANUP_ALL_GAME" ;;
            "Web only|prod") expected="CLEANUP_PLAYTOD" ;;
            "Web only|test") expected="CLEANUP_TODTEST" ;;
            "Web only|all") expected="CLEANUP_WEB" ;;
            "All|prod") expected="CLEANUP_ALL_PROD" ;;
            "All|test") expected="CLEANUP_ALL_TEST" ;;
            "All|all") expected="CLEANUP_ALL" ;;
            *)
              echo "::error::Unknown combination cleanup_target=$TARGET environment=$ENVIRONMENT"
              exit 1
              ;;
          esac

          echo "Required confirm_cleanup phrase: $expected" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CONFIRM" != "$expected" ]; then
            echo "::error::confirm_cleanup must be exactly $expected for cleanup_target=$TARGET, environment=$ENVIRONMENT."
            exit 1
          fi

  cleanup-game-prod:
    name: Cleanup wsplaytod (game)
    needs: guard
    if: inputs.cleanup_target != 'Web only' && inputs.environment != 'test'
    uses: ./.github/workflows/K3s-Cleanup-Game-Server.yml
    with:
      target: wsplaytod
    secrets: inherit

  cleanup-game-test:
    name: Cleanup wstodtest (game)
    needs: guard
    if: inputs.cleanup_target != 'Web only' && inputs.environment != 'prod'
    uses: ./.github/workflows/K3s-Cleanup-Game-Server.yml
    with:
      target: wstodtest
    secrets: inherit

  cleanup-web-prod:
    name: Cleanup playtod (web, soft)
    needs: guard
    if: inputs.cleanup_target != 'Game only' && inputs.environment != 'test'
    uses: ./.github/workflows/K3s-Cleanup-Web-Server.yml
    with:
      target: playtod
    secrets: inherit

  cleanup-web-test:
    name: Cleanup todtest (web, soft)
    needs: guard
    if: inputs.cleanup_target != 'Game only' && inputs.environment != 'prod'
    uses: ./.github/workflows/K3s-Cleanup-Web-Server.yml
    with:
      target: todtest
    secrets: inherit
