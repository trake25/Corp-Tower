name: Backup Deploy Web Server

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/Client/**"
      - ".github/actions/build-godot-web/**"
      - ".github/actions/fetch-private-assets/**"
      - ".github/godot/export_presets.web.ci.cfg"
      - "scripts/write-endpoint-config.sh"
      - ".github/workflows/Backup-Deploy-Web.yml"

  workflow_dispatch:
    inputs:
      target:
        description: "Backup web instance to deploy. Push events always target devtod1."
        required: true
        default: devtod1
        type: choice
        options:
          - devtod1
          - devtod2
          - all
      art_version_override:
        description: "Optional art bundle version (e.g. v2) to fetch instead of the pinned manifest. Skips sha256 verification — testing only, never for release."
        required: false
        default: ""
        type: string

jobs:
  resolve-target:
    name: Resolve Target
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=devtod1" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

  check-devtod1-status:
    name: Check devtod1 Status
    needs: resolve-target
    if: github.event_name == 'push'
    runs-on: [self-hosted, backup]
    timeout-minutes: 5
    outputs:
      devtod1_up: ${{ steps.check.outputs.devtod1_up }}
    steps:
      - name: Check for a running devtod1 container
        id: check
        run: |
          set -euo pipefail
          if docker ps --filter "name=corp-tower-web-1" --filter "status=running" --format '{{.Names}}' | grep -q .; then
            echo "devtod1_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "devtod1_up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::corp-tower-web-1 is not running on the backup machine (stood down) — skipping auto-deploy. Dispatch this workflow manually to redeploy."
          fi

  deploy-devtod1:
    name: Deploy devtod1
    needs: [resolve-target, check-devtod1-status]
    if: |
      always() &&
      (needs.resolve-target.outputs.target == 'devtod1' || needs.resolve-target.outputs.target == 'all') &&
      (needs.check-devtod1-status.result == 'skipped' || needs.check-devtod1-status.outputs.devtod1_up == 'true')
    uses: ./.github/workflows/Backup-Deploy-Web-Server.yml
    with:
      target: devtod1
      art_version_override: ${{ inputs.art_version_override }}
    secrets: inherit

  deploy-devtod2:
    name: Deploy devtod2
    needs: [resolve-target, deploy-devtod1]
    if: |
      always() &&
      (needs.resolve-target.outputs.target == 'devtod2' || needs.resolve-target.outputs.target == 'all') &&
      (needs.deploy-devtod1.result == 'success' || needs.deploy-devtod1.result == 'skipped')
    uses: ./.github/workflows/Backup-Deploy-Web-Server.yml
    with:
      target: devtod2
      art_version_override: ${{ inputs.art_version_override }}
    secrets: inherit
