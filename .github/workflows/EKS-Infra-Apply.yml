name: EKS Infra Apply

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type APPLY_EKS to apply the reviewed EKS infrastructure plan."
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_VAR_aws_region: ap-southeast-1
  TF_VAR_environment: eks-lab
  TF_VAR_ecr_repository_name: ${{ secrets.ECR_REPOSITORY }}
  TF_VAR_operator_principal_arn: ${{ secrets.EKS_OPERATOR_PRINCIPAL_ARN }}
  TF_VAR_ci_principal_arn: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  apply:
    name: Apply EKS Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: infra/eks/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check apply confirmation
        run: |
          if [ "${{ inputs.confirm_apply }}" != "APPLY_EKS" ]; then
            echo "confirm_apply must be exactly APPLY_EKS."
            exit 1
          fi

      - name: Setup AWS credentials and Terraform
        uses: ./.github/actions/aws-terraform-setup
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform backend bucket exists
        uses: ./.github/actions/terraform-backend-bootstrap
        with:
          aws-region: ${{ env.AWS_REGION }}

      - name: Reconcile EKS operator access state
        run: bash ../../../scripts/eks-access-state-reconcile.sh

      - name: Terraform validate and plan before apply
        uses: ./.github/actions/terraform-validate-plan
        with:
          working-directory: infra/eks/terraform

      - name: Reject EKS cluster replacement or deletion
        run: |
          set -euo pipefail
          cluster_actions="$(terraform show -json tfplan | jq -cer '
            [.resource_changes[]? | select(.address == "aws_eks_cluster.main") | .change.actions] as $matches
            | if ($matches | length) > 1 then error("multiple cluster changes")
              elif ($matches | length) == 1 then $matches[0]
              else []
              end
          ')" || {
            echo "::error::Could not determine aws_eks_cluster.main plan actions."
            exit 1
          }
          if jq -e 'index("delete") != null' <<<"$cluster_actions" >/dev/null; then
            echo "::error::Rejected EKS cluster plan containing delete action(s): ${cluster_actions}"
            exit 1
          fi
          echo "EKS cluster plan actions: ${cluster_actions}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Record applied infra tree
        run: |
          set -euo pipefail
          TREE="$(git rev-parse "HEAD:infra/eks/terraform")"
          printf '%s\ncommit=%s\napplied_at=%s\n' "$TREE" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            | aws s3 cp - "s3://corp-tower-tfstate-${AWS_REGION}/eks-lab/applied-infra-tree.txt"
          echo "Recorded applied infra tree ${TREE} (commit ${GITHUB_SHA})." >> "$GITHUB_STEP_SUMMARY"

      - name: Show Terraform outputs
        run: terraform output
