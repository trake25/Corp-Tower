name: Site Deploy (Cloudflare Workers)

# Builds and deploys the LIVE portfolio site at enportfolio.galaxxigames.com
# as a Workers Static Assets site (Cloudflare retired the standalone Pages
# creation flow - see site/wrangler.jsonc). enportfolio is the resume link,
# so this is manual-dispatch + scheduled only, never push-triggered - a
# routine commit must not redeploy it. Auto-deploy-on-push lives on
# devenportfolio instead: see Site-Deploy-Staging-Workers.yml. Independent of
# every game deploy path (EKS/Backup), and uses its own Cloudflare token
# scoped to Workers Scripts:Edit, never the Zone.DNS-Edit token the game's
# DNS updates use.

on:
  workflow_dispatch:
  # 00:00 UTC daily -- midnight London time in GMT (winter); drifts to 1am
  # during BST (late Mar-late Oct). Refreshes the demo-completion stat tile;
  # not worth a second cron entry to correct an hour of drift on a
  # decorative number. Kept on prod as a deliberate exception to
  # manual-only: freshness of a decorative stat outweighs the drift risk.
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: site-deploy-workers
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build And Deploy Portfolio Site
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          DEMO_STATS_API_URL: https://wstoddemo.galaxxigames.com/api/stats/demo
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
