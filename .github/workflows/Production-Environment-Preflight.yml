name: Production Environment Preflight

run-name: Production environment preflight by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-environment-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Strict Production Environment Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17 for keystore verification
        id: java-setup
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Authenticate the Production AWS role
        id: aws-auth
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Setup kubectl for HMAC lineage verification
        id: kubectl-setup
        continue-on-error: true
        uses: azure/setup-kubectl@v4

      - name: Authenticate the Google Play service account
        id: google-auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Validate every required Production value
        env:
          TOD_DATA_ENVIRONMENT: ${{ vars.TOD_DATA_ENVIRONMENT }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_AUTH_REQUIRED: ${{ vars.SUPABASE_AUTH_REQUIRED }}
          CORP_TOWER_AUTH_OAUTH: ${{ vars.CORP_TOWER_AUTH_OAUTH }}
          PLAYER_IDENTITY_HMAC_KEY_VERSION: ${{ vars.PLAYER_IDENTITY_HMAC_KEY_VERSION }}
          PLAYER_IDENTITY_HMAC_PREVIOUS_KEY_VERSION: ${{ vars.PLAYER_IDENTITY_HMAC_PREVIOUS_KEY_VERSION }}
          TOD_FACEBOOK_APP_ID: ${{ vars.TOD_FACEBOOK_APP_ID }}
          TOD_FACEBOOK_CLIENT_TOKEN: ${{ vars.TOD_FACEBOOK_CLIENT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOD_FACEBOOK_APP_SECRET: ${{ secrets.TOD_FACEBOOK_APP_SECRET }}
          GOOGLE_OAUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}
          PLAYER_IDENTITY_HMAC_SECRET: ${{ secrets.PLAYER_IDENTITY_HMAC_SECRET }}
          PLAYER_IDENTITY_HMAC_PREVIOUS_SECRET: ${{ secrets.PLAYER_IDENTITY_HMAC_PREVIOUS_SECRET }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          EKS_OPERATOR_PRINCIPAL_ARN: ${{ secrets.EKS_OPERATOR_PRINCIPAL_ARN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANDROID_RELEASE_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          AWS_AUTH_OUTCOME: ${{ steps.aws-auth.outcome }}
          JAVA_SETUP_OUTCOME: ${{ steps.java-setup.outcome }}
          KUBECTL_SETUP_OUTCOME: ${{ steps.kubectl-setup.outcome }}
          GOOGLE_AUTH_OUTCOME: ${{ steps.google-auth.outcome }}
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: node scripts/verify-production-environment.mjs
